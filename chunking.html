<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chunking — RAG_LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">RAG_LAB</a>
  <ul class="nav-links">
    <li><a href="chunking.html" class="active">Chunking</a></li>
    <li><a href="embedding.html">Embedding</a></li>
    <li><a href="vectordb.html">Vector DB</a></li>
    <li><a href="query.html">Query</a></li>
  </ul>
</nav>

<main class="page-main">
  <h1>01 · Chunking</h1>

  <div class="stage-layout">
    <div class="panel explanation-panel">
      <button class="panel-title collapsible" id="explanation-toggle" aria-expanded="true">
        <span class="toggle-indicator" id="toggle-indicator">[-]</span>What Is Chunking?
      </button>
      <div class="explanation-body" id="explanation-body">
        <div class="explanation-general" id="explanation-general"></div>
        <p class="explanation-reactive" id="explanation-reactive"></p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Input Text</div>
      <textarea id="input-text" rows="5"></textarea>

      <div class="control-row" style="margin-top: 16px;">
        <label for="strategy">Strategy</label>
        <select id="strategy">
          <option value="fixed">Fixed-size</option>
          <option value="sentence">Sentence-based</option>
        </select>
      </div>

      <div class="control-row">
        <label for="size">Chunk size: <span class="value-readout" id="size-value"></span> characters</label>
        <input type="range" id="size" min="20" max="300" step="5" />
      </div>

      <div class="control-row">
        <label for="overlap">Overlap: <span class="value-readout" id="overlap-value"></span> <span id="overlap-unit">characters</span></label>
        <input type="range" id="overlap" min="0" max="100" step="5" />
      </div>

      <div class="panel-title" style="margin-top: 24px;">Chunks</div>
      <div class="chunk-list" id="chunk-list"></div>
      <p class="summary-line" id="chunk-summary"></p>
    </div>
  </div>
</main>

<script src="ragmath.js"></script>
<script src="chunking.js"></script>
</body>
</html>
